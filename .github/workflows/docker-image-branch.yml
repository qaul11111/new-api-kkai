name: KKAI Manual Production Artifact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact production/kkrich commit to build
        required: true
        type: string
      schema_contract:
        description: Database schema contract
        required: true
        default: feature
        type: choice
        options:
          - feature
          - bridge

permissions:
  contents: read

concurrency:
  group: kkai-manual-production-artifact-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build-amd64-artifact:
    if: github.repository == 'qaul11111/new-api-kkai'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the production branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: production/kkrich

      - name: Lock the requested source commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          [[ "${actual_source_sha}" == "${EXPECTED_SOURCE_SHA}" ]]
          [[ "$(git branch --show-current)" == production/kkrich ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          echo "SOURCE_SHA=${actual_source_sha}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the native linux/amd64 release archive
        id: release
        env:
          SCHEMA_CONTRACT: ${{ inputs.schema_contract }}
        run: |
          set -Eeuo pipefail
          output="$(scripts/kkai/build-manual-release.sh --schema-contract "${SCHEMA_CONTRACT}")"
          metadata="${output#MANUAL_RELEASE_METADATA=}"
          [[ "${metadata}" == /* && -f "${metadata}" ]]
          archive="$(dirname -- "${metadata}")/$(jq --raw-output '.archive' "${metadata}")"
          [[ -f "${archive}" ]]
          [[ "$(jq --raw-output '.source_sha' "${metadata}")" == "${SOURCE_SHA}" ]]
          [[ "$(jq --raw-output '.schema_contract' "${metadata}")" == "${SCHEMA_CONTRACT}" ]]
          [[ "$(jq --raw-output '.platform' "${metadata}")" == linux/amd64 ]]
          [[ "$(sha256sum "${archive}" | awk '{print $1}')" == "$(jq --raw-output '.archive_sha256' "${metadata}")" ]]
          echo "metadata=${metadata}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Verify the image embedded in the archive
        env:
          METADATA: ${{ steps.release.outputs.metadata }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -Eeuo pipefail
          image_tag="$(jq --raw-output '.image_tag' "${METADATA}")"
          version="$(jq --raw-output '.version' "${METADATA}")"
          schema_contract="$(jq --raw-output '.schema_contract' "${METADATA}")"
          docker load --input "${ARCHIVE}" >/dev/null
          [[ "$(docker image inspect "${image_tag}" --format '{{.Os}}/{{.Architecture}}')" == linux/amd64 ]]
          [[ "$(docker image inspect "${image_tag}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "${SOURCE_SHA}" ]]
          [[ "$(docker image inspect "${image_tag}" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" == "${version}" ]]
          [[ "$(docker image inspect "${image_tag}" --format '{{index .Config.Labels "io.kkrich.schema-contract"}}')" == "${schema_contract}" ]]

      - name: Upload the verified offline release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kkai-production-${{ inputs.source_sha }}
          path: |
            ${{ steps.release.outputs.metadata }}
            ${{ steps.release.outputs.archive }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true
